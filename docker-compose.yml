services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rebuttal
      POSTGRES_PASSWORD: rebuttal
      POSTGRES_DB: rebuttal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rebuttal"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
